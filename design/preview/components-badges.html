<!doctype html>
<!-- @dsCard group="Components" name="Badges" subtitle="Status + tag pills" viewport="700x100" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>

  <span style="font:600 11px/1 var(--font-sans);padding:6px 12px;background:#FCE6EE;color:#A2195B;border-radius:999px;letter-spacing:.04em">AP 12</span>
