<!doctype html>
<!-- @dsCard group="Colors" name="Gradients" subtitle="Brand gradient + text gradient" viewport="700x300" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
<div style="height:140px;border-radius:10px;background:linear-gradient(95deg,#006EB7 0%,#2B418C 28%,#A2195B 70%,#E61971 100%);display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:600;letter-spacing:.02em">Brand gradient — 95°</div>
<div style="margin-top:10px;height:60px;border-radius:10px;background:linear-gradient(95deg,#6FB0E1 0%,#F190B2 100%);display:flex;align-items:center;padding:0 14px;color:#1a2a4a;font-weight:600">Soft gradient (backgrounds)</div>
<div style="margin-top:10px;font-family:var(--font-display);font-size:32px;font-weight:300;background:linear-gradient(95deg,#006EB7 0%,#E61971 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.015em">Inline text gradient</div>
</div></body></html>
